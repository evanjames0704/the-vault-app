name: Vault
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Vault:
    type: application
    platform: iOS
    sources:
      - Vault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evantrampp.thevault
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: THE VAULT
        INFOPLIST_KEY_NSCameraUsageDescription: Scan a collectible barcode to find its exact edition in THE VAULT.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
